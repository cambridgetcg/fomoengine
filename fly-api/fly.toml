app = "fomoengine"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  X402_PUBLIC_ORIGIN = "https://api.fomoengine.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
